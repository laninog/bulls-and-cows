name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# `shell: bash` explícito activa `-o pipefail`: sin él, `cmd | tee` oculta el fallo de `cmd`.
defaults:
  run:
    shell: bash

jobs:
  check:
    name: lint · formato · contraste · tipos · tests · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # SCA (SEC-05): falla ante vulnerabilidades altas o críticas en cualquier dependencia.
      - run: pnpm check:audit
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm check:contrast
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
          # .assetsignore es un fichero oculto: sin esto se perdería y se publicarían los source maps.
          include-hidden-files: true
          retention-days: 7

  e2e:
    name: e2e · accesibilidad · PWA (contra el Worker)
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - run: pnpm --filter @bnc/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

  # Producción: solo desde main y solo si check y e2e han pasado. Se publica
  # exactamente la build que pasó las pruebas (artefacto web-dist).
  deploy:
    name: despliegue a producción
    needs: [check, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: production
      url: ${{ steps.deploy.outputs.url }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - name: wrangler deploy
        id: deploy
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          test -f ../web/dist/.assetsignore || { echo "::error::Falta .assetsignore en la build"; exit 1; }
          if ! pnpm exec wrangler deploy --var "APP_VERSION:${GITHUB_SHA::7}" 2>&1 | tee deploy.log; then
            bash ../../scripts/wrangler-errors.sh deploy.log "wrangler deploy"
            exit 1
          fi
          url=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1 || true)
          if [ -z "$url" ]; then
            echo "::error title=wrangler deploy::Desplegado, pero sin URL workers.dev en la salida. Comprueba en Cloudflare que el subdominio workers.dev está registrado y la ruta workers.dev activa para el Worker."
            exit 1
          fi
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### Producción: $url" >> "$GITHUB_STEP_SUMMARY"
      - name: comprobación tras el despliegue
        env:
          URL: ${{ steps.deploy.outputs.url }}
        # La nueva versión tarda unos segundos en propagarse por la red de Cloudflare (y un subdominio
        # workers.dev recién creado, algo más): se reintenta hasta que /api/health sirva este commit.
        run: |
          expected="\"version\":\"${GITHUB_SHA::7}\""
          body=""
          for i in $(seq 1 24); do
            body=$(curl -sS --max-time 10 "$URL/api/health" 2>&1 || true)
            if grep -q "$expected" <<<"$body"; then
              echo "OK en el intento $i: $body"
              exit 0
            fi
            echo "intento $i: ${body:-sin respuesta}"
            sleep 5
          done
          echo "::error title=comprobación::$URL/api/health no sirve ${GITHUB_SHA::7} tras 2 minutos. Última respuesta: ${body:-ninguna}"
          exit 1

  # Previsualización por PR (solo PRs del propio repositorio: los forks no tienen acceso a los secretos).
  preview:
    name: previsualización del PR
    needs: [check, e2e]
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist
      - name: wrangler versions upload
        working-directory: apps/api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: |
          if ! pnpm exec wrangler versions upload --preview-alias "pr-${{ github.event.number }}" \
            --var "APP_VERSION:pr-${{ github.event.number }}-${GITHUB_SHA::7}" 2>&1 | tee upload.log; then
            bash ../../scripts/wrangler-errors.sh upload.log "wrangler versions upload"
            exit 1
          fi
          {
            echo "### Previsualización del PR #${{ github.event.number }}"
            grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' upload.log | sort -u | sed 's/^/- /'
          } >> "$GITHUB_STEP_SUMMARY"
